openapi: 3.1.0
info:
  title: DocuPipe Detailed Retrieval API
  description: Access granular analysis results, including text extraction and bounding boxes.
  version: 1.0.0

servers:
  - url: https://api.fluidzy.com/v1
    description: Production server

paths:
  /document/{document_id}/detailed:
    get:
      operationId: get-document-detailed
      summary: Retrieve Detailed Processing Result
      description: |
        Access the analysis results of your submitted document. 
        The `status` field indicates the processing stage, and the `result` field provides 
        extracted plain text along with granular information like bounding boxes for detection.
      parameters:
        - name: document_id
          in: path
          required: true
          description: The unique identifier of the document.
          schema:
            type: string
            example: "doc_12345abc"
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Successful retrieval of detailed document data
          content:
            application/json:
              schema:
                type: object
                properties:
                  documentId:
                    type: string
                  status:
                    type: string
                    enum: [processing, completed, failed]
                  result:
                    type: object
                    properties:
                      text:
                        type: string
                        description: The full extracted plain text.
                      entities:
                        type: array
                        items:
                          type: object
                          properties:
                            text:
                              type: string
                            type:
                              type: string
                            boundingBox:
                              type: array
                              items:
                                type: number
        '404':
          description: Document not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT